<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amélioration d'Image UHD/4K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">Amélioration d'Image UHD/4K</h1>
    <section id="upload-section" class="card glass">
      <input type="file" id="file-input" accept="image/*" hidden />
      <label for="file-input" class="upload-area">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>Glissez‑déposez une image ou cliquez pour sélectionner</p>
      </label>
    </section>
    <section id="result-section" class="card glass hidden">
      <h2 class="subtitle">Résultat</h2>
      <canvas id="result-canvas"></canvas>
      <button id="download-btn" class="btn">Télécharger l'image améliorée</button>
    </section>
  </main>
  <script type="module">
// src/main.js
// UpscalerJS implementation – loads model from CDN, no tf import needed.

// UI Elements
const fileInput = document.getElementById('file-input');
const uploadSection = document.getElementById('upload-section');
const resultSection = document.getElementById('result-section');
const resultCanvas = document.getElementById('result-canvas');
const downloadBtn = document.getElementById('download-btn');

let upscaler = null;
async function loadUpscaler() {
  if (!upscaler) {
    console.log('Loading UpscalerJS Real‑ESRGAN model…');
    upscaler = new Upscaler({
      model: 'esrgan-legacy',
      scale: 4,
    });
    await upscaler.ready;
  }
  return upscaler;
}

async function upscaleImage(file) {
  const up = await loadUpscaler();
  const img = new Image();
  const objectUrl = URL.createObjectURL(file);
  img.src = objectUrl;
  await new Promise((resolve, reject) => {
    img.onload = () => resolve();
    img.onerror = (e) => reject(e);
  });
  const upscaledCanvas = await up.upscale(img);
  URL.revokeObjectURL(objectUrl);
  const ctx = resultCanvas.getContext('2d');
  resultCanvas.width = upscaledCanvas.width;
  resultCanvas.height = upscaledCanvas.height;
  ctx.drawImage(upscaledCanvas, 0, 0);
  resultCanvas.style.display = 'block';
  resultSection.classList.remove('hidden');
  downloadBtn.onclick = () => {
    resultCanvas.toBlob((blob) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `upscaled_${file.name}`;
      link.click();
      URL.revokeObjectURL(link.href);
    }, 'image/png');
  };
}

uploadSection.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    await upscaleImage(file);
  } catch (err) {
    console.error(err);
    alert('Erreur pendant le traitement de l\'image. Consultez la console pour plus de détails.');
  }
});
</script>
</body>
</html>
